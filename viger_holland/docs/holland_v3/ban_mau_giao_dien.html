<style>
/* Bố cục: thanh trên cố định (4 khu), nội dung một cột rộng tối đa 1080px; màu theo web chính viger.edu.vn */
:root {
  --bg: #fdfbf7; --surface: #ffffff; --sunk: #f4f1ec; --line: #e2e8f0; --line-strong: #c9d2dd;
  --fg: #12263f; --fg-2: #4a5c71; --muted: #7a8b9c;
  --accent: #c1121f; --accent-ink: #ffffff; --accent-soft: #fdf2f2;
  --gold: #ffb703; --gold-soft: #fff4d6;
  --bar-strong: #12263f; --bar-mid: #8796a8; --bar-weak: #cfd7e1;
  --ok: #1f7a4d; --ok-soft: #e6f4ec; --warn: #9a6200; --warn-soft: #fff4d6; --bad: #a3141f; --bad-soft: #fde8e9;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1724; --surface: #152234; --sunk: #1b2b40; --line: #263850; --line-strong: #36506f;
  --fg: #e9eef5; --fg-2: #b4c1d1; --muted: #8696aa;
  --accent: #ef4b55; --accent-ink: #160406; --accent-soft: #3a1418;
  --gold: #ffc53d; --gold-soft: #3a2e10;
  --bar-strong: #e9eef5; --bar-mid: #7f93ab; --bar-weak: #3a4f69;
  --ok: #5cc98f; --ok-soft: #12321f; --warn: #f1b453; --warn-soft: #3a2b0e; --bad: #f2707a; --bad-soft: #3d151a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1724; --surface: #152234; --sunk: #1b2b40; --line: #263850; --line-strong: #36506f;
  --fg: #e9eef5; --fg-2: #b4c1d1; --muted: #8696aa;
  --accent: #ef4b55; --accent-ink: #160406; --accent-soft: #3a1418;
  --gold: #ffc53d; --gold-soft: #3a2e10;
  --bar-strong: #e9eef5; --bar-mid: #7f93ab; --bar-weak: #3a4f69;
  --ok: #5cc98f; --ok-soft: #12321f; --warn: #f1b453; --warn-soft: #3a2b0e; --bad: #f2707a; --bad-soft: #3d151a;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25 }
h1 { font: 700 clamp(26px, 4vw, 34px)/1.2 var(--font-display) }
h2 { font: 700 22px/1.3 var(--font-display) }
h3 { font-size: 16px; font-weight: 600 }
p { margin: 0 }
button, input, select { font: inherit; color: inherit }
.num { font-variant-numeric: tabular-nums }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* thanh trên */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto }
.brand b { font: 700 19px var(--font-display); letter-spacing: .02em }
.brand b span { color: var(--accent) }
.brand small { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase }
.nav { display: flex; gap: 4px; flex-wrap: wrap }
.nav a { padding: 7px 12px; border-radius: 999px; color: var(--fg-2); text-decoration: none; font-weight: 500; font-size: 14px }
.nav a[aria-current="page"] { background: var(--fg); color: var(--bg) }
.nav a:hover:not([aria-current]) { background: var(--sunk) }
.nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }

main { padding-block: 28px 64px }
.view { display: grid; gap: 22px }
.lead { color: var(--fg-2); max-width: 66ch }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px }
.sunk { background: var(--sunk); border-radius: var(--r); padding: 16px }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.grid2 > *, .grid3 > * { min-width: 0 }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 10px 18px; border-radius: 999px; cursor: pointer; font-weight: 600 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.dark { background: var(--fg); border-color: var(--fg); color: var(--bg) }
.btn.small { padding: 6px 12px; font-size: 13px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--sunk); color: var(--fg-2) }
.chip.ok { background: var(--ok-soft); color: var(--ok) } .chip.warn { background: var(--warn-soft); color: var(--warn) } .chip.bad { background: var(--bad-soft); color: var(--bad) }
.chip.red { background: var(--accent-soft); color: var(--accent) } .chip.gold { background: var(--gold-soft); color: var(--warn) }
.help { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line-strong); font: 600 11px var(--font-body); color: var(--fg-2); cursor: help; vertical-align: middle; position: relative }
.help:hover::after, .help:focus::after { content: attr(data-tip); position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: min(280px, 70vw); background: var(--fg); color: var(--bg); font: 400 12.5px/1.45 var(--font-body); padding: 9px 11px; border-radius: 8px; z-index: 20; text-align: left }
.what { display: flex; gap: 10px; align-items: flex-start; background: var(--gold-soft); border-radius: var(--r-sm); padding: 10px 14px; font-size: 13.5px; color: var(--fg) }
.what b { white-space: nowrap }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm) }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th { text-align: left; background: var(--sunk); font-weight: 600; color: var(--fg-2); padding: 9px 10px; white-space: nowrap; position: sticky; top: 0 }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top }
td.c, th.c { text-align: center }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px }

/* bước học sinh */
.steps { display: flex; gap: 8px; flex-wrap: wrap }
.steps span { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--sunk); color: var(--muted) }
.steps span.on { background: var(--fg); color: var(--bg) }
.steps span.done { color: var(--fg-2) }
.method { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center }
.hexlogo { width: 120px; height: 120px }
@media (max-width: 520px) { .method { grid-template-columns: 1fr } }
label.f { display: grid; gap: 5px; font-size: 13.5px; font-weight: 500 }
label.f input, label.f select { border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 9px 11px; background: var(--surface); width: 100% }
label.f .req { color: var(--accent) }
label.f .err { color: var(--bad); font-size: 12.5px; font-weight: 500 }
details.opt-group { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; background: var(--surface) }
details.opt-group summary { cursor: pointer; font-weight: 600 }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px }

.progress { height: 8px; background: var(--sunk); border-radius: 999px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s }
.q { font: 600 clamp(20px, 3vw, 26px)/1.35 var(--font-display) }
.opts { display: grid; gap: 10px }
.opt { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer; background: var(--surface) }
.opt input { accent-color: var(--accent); width: 18px; height: 18px }
.opt .k { width: 26px; height: 26px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none }
.opt.sel { border-color: var(--fg); background: var(--sunk) }
.opt.kb { border-style: dashed }
.nudge { border-left: 3px solid var(--gold); padding: 8px 12px; background: var(--gold-soft); border-radius: 0 8px 8px 0; font-size: 13.5px }

/* kết quả */
.viewas { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; gap: 2px; background: var(--surface) }
.viewas button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--fg-2) }
.viewas button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }
.code { font: 700 clamp(44px, 8vw, 64px)/1 var(--font-display); letter-spacing: .06em }
.code .dim { color: var(--muted) }
.bars { display: grid; gap: 9px }
.bar { display: grid; grid-template-columns: 128px 1fr 150px; gap: 12px; align-items: center; font-size: 14px }
.bar .track { position: relative; height: 22px; border-radius: 4px; background: linear-gradient(90deg, var(--sunk) 0 20%, transparent 20% 40%, var(--sunk) 40% 60%, transparent 60% 80%, var(--sunk) 80%); border: 1px solid var(--line) }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px 4px 4px 3px }
.bar .mark { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--accent) }
.bar .v { color: var(--fg-2); font-size: 13px }
@media (max-width: 560px) { .bar { grid-template-columns: 90px 1fr; } .bar .v { grid-column: 2 } }
.scale-labels { display: grid; grid-template-columns: 128px 1fr 150px; gap: 12px; font-size: 11.5px; color: var(--muted) }
.scale-labels div:nth-child(2) { display: flex; justify-content: space-between }
@media (max-width: 560px) { .scale-labels { grid-template-columns: 90px 1fr } .scale-labels div:nth-child(3) { display: none } }
.hex svg { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto }
.majors { display: grid; gap: 10px }
.major { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; background: var(--surface) }
.major .de { font-style: italic; color: var(--fg-2); font-size: 13.5px }
.major .why { grid-column: 1 / -1; font-size: 13px; color: var(--fg-2) }
.inside { border-left: 3px solid var(--fg); padding-left: 12px }
.locked { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 16px; color: var(--fg-2) }

/* sơ đồ hệ thống */
.arch { display: grid; gap: 14px }
.layer { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: stretch }
.layer > h3 { background: var(--fg); color: var(--bg); border-radius: var(--r-sm); padding: 12px; font-size: 14px; display: flex; align-items: center }
.layer .boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; min-width: 0 }
.box { border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface); font-size: 13.5px }
.box b { display: block; font-size: 14px }
.box small { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 12px }
@media (max-width: 640px) { .layer { grid-template-columns: 1fr } }
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13.5px }
.flow span { border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 12px; background: var(--surface) }
.flow i { color: var(--muted); font-style: normal }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px }
.tabs button { border: 1px solid transparent; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--fg-2) }
.tabs button[aria-selected="true"] { background: var(--sunk); border-color: var(--line); color: var(--fg) }
.toggle { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--bar-weak); position: relative; cursor: pointer; vertical-align: middle }
.toggle::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); top: 2px; left: 2px; transition: left .15s }
.toggle:checked { background: var(--ok) } .toggle:checked::after { left: 18px }
input.set { width: 90px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; background: var(--surface) }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

      let b = null;
      for (const c of mj.codes) {
        const ci = cIndex(code3, c);
        let w = 0; [3, 2, 1].forEach((wt, i) => { if (c[i]) w += wt * groups[c[i]].mean; });
        if (!b || cmp([ci, w], [b.c, b.w]) > 0) b = { c: ci, w: r4(w), code: c };
      }
      return b;
    };
    const label = (c) => { if (c === null || c === undefined) return 'Chưa có mã ngành'; for (const [min, l] of S.c_labels) if (c >= min) return l; return null; };
    const pairRows = (pair ? pair.majors : []).filter((id) => byId[id] && byId[id].active).map((id, k) => {
      const mj = byId[id]; const b = best(mj) || {};
      return { id, name_vi: mj.name_vi, name_de: mj.name_de, source: 'pair', pair: pair.pair, code: b.code ?? null, c: b.c ?? null, w: b.w ?? 0, orig: k, label: 'Ngành nền của cặp ' + pair.pair };
    });
    pairRows.sort((x, y) => cmp([y.c ?? -1, y.w, -y.orig], [x.c ?? -1, x.w, -x.orig]));
    const others = [];
    for (const mj of D.majors) {
      if (!mj.active || (pair && pair.majors.includes(mj.id)) || !mj.codes.length) continue;
      const b = best(mj);
      if (groups[b.code[0]].mean <= S.interest_mark) continue;
      const l = label(b.c); if (l === null) continue;
      others.push({ id: mj.id, name_vi: mj.name_vi, name_de: mj.name_de, source: 'catalog', pair: null, code: b.code, c: b.c, w: b.w, label: l });
    }
    others.sort((x, y) => cmp([y.c, y.w], [x.c, x.w]) || (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
    return [...pairRows, ...others].map((r, i) => { const o = { ...r, rank: i + 1 }; delete o.orig; return o; });
  }

  function flags(answers, groups) {
    const f = [];
    const scored = answers.filter((a) => !a.check);
    const kbTotal = Object.values(groups).reduce((s, g) => s + g.dont_know, 0);
    if (kbTotal > S.dont_know_flag_total) f.push({ code: 'nhieu_khong_biet', level: 'nhe', detail: `${kbTotal} câu "Không biết"` });
    const short = Object.values(groups).filter((g) => !g.enough).map((g) => g.code);
    if (short.length) f.push({ code: 'nhom_thieu_du_lieu', level: short.length >= 2 ? 'nang' : 'nhe', detail: short.join(', ') });
    const vals = scored.map((a) => a.value).filter((v) => v !== null);
    if (vals.length) {
      const cnt = {}; vals.forEach((v) => (cnt[v] = (cnt[v] || 0) + 1));
      const share = Math.max(...Object.values(cnt)) / scored.length;
      if (share >= S.one_option_share) f.push({ code: 'mot_muc_chiem', level: 'nang', detail: Math.round(share * 100) + '% cùng một mức' });
    }
    let run = 0, longest = 0, prev = 'x';
    for (const a of scored) { run = a.value !== null && a.value === prev ? run + 1 : 1; prev = a.value; longest = Math.max(longest, run); }
    if (longest >= S.longstring) f.push({ code: 'chuoi_giong_nhau', level: 'nhe', detail: `${longest} câu liên tiếp cùng mức` });
    const ms = answers.map((a) => a.ms).filter((v) => v !== null && v !== undefined);
    if (ms.length === answers.length && ms.length) {
      const avg = ms.reduce((s, v) => s + Math.min(v, 60000), 0) / ms.length / 1000;
      if (avg < S.fast_avg_seconds) f.push({ code: 'qua_nhanh', level: 'nang', detail: Math.round(avg * 10) / 10 + ' giây/câu' });
      let rr = 0, b = 0; for (const v of ms) { rr = v < S.rushed_seconds * 1000 ? rr + 1 : 0; b = Math.max(b, rr); }
      if (b >= S.rushed_run) f.push({ code: 'doan_bam_voi', level: 'nhe', detail: `${b} câu liên tiếp dưới 1 giây` });
    }
    const heavy = f.filter((x) => x.level === 'nang').length;
    return { reliability: heavy ? 'Chưa đủ tin cậy' : f.length ? 'Cần xem lại' : 'Tin cậy', items: f };
  }

  function score(answers) {
    const sum = {}, cnt = {}, kb = {};
    for (const g of ORDER) { sum[g] = 0; cnt[g] = 0; kb[g] = 0; }
    for (const a of answers) { if (a.check) continue; if (a.value === null) kb[a.group]++; else { sum[a.group] += a.value; cnt[a.group]++; } }
    const groups = {};
    for (const g of ORDER) {
      const mean = cnt[g] ? sum[g] / cnt[g] : 0;
      groups[g] = { code: g, mean: r4(mean), answered: cnt[g], dont_know: kb[g], enough: cnt[g] >= S.min_valid_per_group, band: cnt[g] ? band(mean) : 'Chưa đủ dữ liệu' };
    }
    const order = Object.values(groups).sort((x, y) => cmp([y.enough ? 1 : 0, y.mean, -ORDER.indexOf(y.code)], [x.enough ? 1 : 0, x.mean, -ORDER.indexOf(x.code)])).map((g) => g.code);
    const [g1, g2, g3, g4] = order; const m = (g) => groups[g].mean;
    const code2 = g1 + g2, code3 = g1 + g2 + g3;
    const thirdDetail = m(g3) > S.third_letter_threshold && (!S.third_letter_requires_full || groups[g3].answered >= S.items_per_group);
    const alternates = [];
    if (m(g3) - m(g4) <= S.near_tie_gap + 1e-9) alternates.push(g1 + g2 + g4);
    if (m(g2) - m(g3) <= S.near_tie_gap + 1e-9) alternates.push(g1 + g3 + g2);
    if (m(g1) - m(g2) <= S.near_tie_gap + 1e-9) alternates.push(g2 + g1 + g3);
    const rel = (a, b) => ({ pair: a + b, distance: hexD(a, b), relation: REL[hexD(a, b)] });
    const relations = { '1-2': rel(g1, g2), '1-3': rel(g1, g3), '2-3': rel(g2, g3) };
    let x = 0, y = 0;
    [...ORDER].forEach((g, i) => { x += m(g) * Math.cos((i * 60 * Math.PI) / 180); y += m(g) * Math.sin((i * 60 * Math.PI) / 180); });
    const means = [...ORDER].map(m);
    return {
      schema: 'holland-result/3', groups, order, code2, code3, third_detail: thirdDetail,
      third: thirdDetail ? D.third_letters.find((t) => t.code === g3) : null, alternates, relations, consistency: CONS[relations['1-2'].distance],
      profile: { elevation: r4(means.reduce((s, v) => s + v, 0) / 6), differentiation: r4(Math.max(...means) - Math.min(...means)), axis_x: r4(x), axis_y: r4(y), strength: r4(Math.hypot(x, y)) },
      majors: recommend(code3, groups), flags: flags(answers, groups),
    };
  }
  return { score, band, cIndex, hexD, pairKey, recommend };
}

function hexChart(r) {
  const cx = 150, cy = 150, R = 105; const pt = (g, v) => { const i = ORDER.indexOf(g); const a = (Math.PI / 180) * (90 - i * 60); const rr = ((v - 1) / 4) * R; return [cx + rr * Math.cos(a), cy - rr * Math.sin(a)]; };
  const ring = (v) => [...ORDER].map((g) => pt(g, v).join(',')).join(' ');
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Lục giác hồ sơ">${[1.8, 2.6, 3.4, 4.2, 5].map((v) => `<polygon points="${ring(v)}" fill="none" stroke="${v === 4.2 ? 'var(--accent)' : 'var(--line)'}" stroke-dasharray="${v === 4.2 ? '4 3' : ''}"/>`).join('')}
  ${[['R', 'S'], ['I', 'E'], ['A', 'C']].map(([a, b]) => `<line x1="${pt(a, 5)[0]}" y1="${pt(a, 5)[1]}" x2="${pt(b, 5)[0]}" y2="${pt(b, 5)[1]}" stroke="var(--line-strong)" stroke-dasharray="2 4"/>`).join('')}
  <polygon points="${[...ORDER].map((g) => pt(g, r.groups[g].mean).join(',')).join(' ')}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2"/>
  ${[...ORDER].map((g) => { const [x, y] = pt(g, 5.9); return `<text x="${x}" y="${y + 5}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)">${g}</text>`; }).join('')}</svg>`;
}

function impactTable() {
  const rows = Object.entries(SAMPLES).map(([n, p]) => { const ans = []; for (let k = 0; k < 6; k++) for (const g of ORDER) ans.push({ code: g, group: g, value: p[g][k], ms: 4000 }); const r = E.score(ans); return `<tr><td>${esc(n)}</td><td class="mono">${r.code3}</td><td class="mono">${r.third_detail ? r.code3 : r.code2}</td><td>${r.flags.reliability}</td><td>${esc(r.majors[0]?.name_de || '—')}</td></tr>`; }).join('');
  return `<div class="tw"><table><tr><th>Hồ sơ mẫu</th><th>Mã đủ</th><th>Khách thấy</th><th>Độ tin cậy</th><th>Ngành đầu</th></tr>${rows}</table></div>`;
}
function adminQuestions() {
  const s = D.settings;
  return `${what('Ngân hàng câu hỏi: mỗi câu thuộc một nhóm, một ý và một cách viết. Đề được rút theo cài đặt; nhập và xuất Excel để Thầy soạn câu.')}
  <div class="row"><button class="btn dark" data-act="noop">+ Thêm câu</button><button class="btn" data-act="noop">Nhập Excel</button><button class="btn" data-act="noop">Xuất Excel</button><button class="btn" data-act="draw">Xem thử một đề</button><span class="chip">${D.questions.length} câu trong ngân hàng</span><span class="chip">Cách rút: ${{ fixed: 'Cố định', by_facet: 'Theo ý', random: 'Ngẫu nhiên' }[s.draw_mode]}</span></div>
  <div id="draw"></div>
  <p class="nudge">Nội dung câu đang tạm lấy từ bộ câu cũ; thay bằng bộ 72 câu R01 – C12 của Thầy bằng nút "Nhập Excel".</p>
  <div class="tw" style="max-height:460px"><table><tr><th>Mã</th><th>Nhóm</th><th class="c">Ý</th><th class="c">Cách viết</th><th>Nội dung</th><th class="c">Trong bộ cố định</th><th class="c">Bật</th></tr>

}
function adminPairs() {
  const byId = Object.fromEntries(D.majors.map((m) => [m.id, m]));
  return `${what('15 cặp hai chữ của Thầy: quan hệ trên lục giác, 2 ngành nền, 2 nghề, môn nền. Sửa một cặp thì 8 mã ba chữ liên quan tự cập nhật.')}
  <div class="tw"><table><tr><th>Cặp</th><th>Quan hệ</th><th>Ngành nền 1</th><th>Ngành nền 2</th><th>Nghề</th><th>Môn nền</th></tr>
  ${D.riasec_pairs.map((p) => `<tr><td class="mono"><b>${p.pair}</b></td><td><span class="chip ${p.relation === 'Đối kháng' ? 'red' : p.relation === 'Liền kề' ? 'ok' : ''}">${p.relation}</span></td>${p.majors.map((id) => `<td>${esc(byId[id].name_vi)}<br><span style="color:var(--fg-2);font-style:italic">${esc(byId[id].name_de)}</span> <span class="mono">${esc(byId[id].codes[0] || '—')}</span></td>`).join('')}<td style="font-size:13px">${p.occupations.map(esc).join('<br>')}</td><td style="font-size:13px;color:var(--fg-2)">${esc(p.foundation)}</td></tr>`).join('')}</table></div>`;
}
function adminCodes() {
  const q = (ST.codeFilter || '').toUpperCase();
  const all = []; for (const a of ORDER) for (const b of ORDER) for (const c of ORDER) if (a !== b && b !== c && a !== c) all.push(a + b + c);
  const byId = Object.fromEntries(D.majors.map((m) => [m.id, m]));
  const rows = all.filter((c) => !q || c.startsWith(q) || c.includes(q)).map((code) => {
    const fake = Object.fromEntries([...ORDER].map((g) => [g, { mean: 3 }])); [...code].forEach((g, i) => (fake[g] = { mean: 5 - i * 0.3 }));
    const ms = E.recommend(code, fake).filter((m) => m.source === 'pair');
    const pair = E.pairKey(code[0], code[1]); const P = D.riasec_pairs.find((p) => p.pair === pair); const T = D.third_letters.find((t) => t.code === code[2]);
    return `<tr><td class="mono"><b>${code}</b></td><td class="mono">${pair}</td><td>${P.relation}</td><td>${ms.map((m) => `${esc(m.name_de)} <span class="mono" style="color:var(--fg-2)">${m.code || '—'}·C${m.c ?? '—'}</span>`).join(' → ')}</td><td>${esc(T.specialty_en)}</td><td style="font-size:13px;color:var(--fg-2)">Ưu tiên ${D.riasec_types.find((t) => t.code === code[0]).label.toLowerCase()}; kết hợp ${D.riasec_types.find((t) => t.code === code[1]).label.toLowerCase()}; bổ sung ${D.riasec_types.find((t) => t.code === code[2]).label.toLowerCase()}.</td></tr>`; }).join('');
  return `${what('120 mã không gõ tay: ghép từ 6 nhóm + 15 cặp + 6 hướng chuyên sâu. Thứ tự ngành của cặp theo mã có thứ tự, nên ISA và SIA khác nhau.')}
  <label class="f" style="max-width:260px">Lọc mã (ví dụ IS, SI, RIC)<input id="code-filter" data-codefilter value="${esc(ST.codeFilter || '')}" maxlength="3"></label>
  <div class="tw" style="max-height:520px"><table><tr><th>Mã</th><th>Cặp</th><th>Quan hệ 1–2</th><th>Ngành nền theo thứ tự</th><th>Chuyên sâu (chữ 3)</th><th>Diễn giải (mẫu câu của Thầy)</th></tr>${rows}</table></div>`;
}

  return `${what('Danh mục ngành hợp nhất từ hai file của Thầy. Mã Holland lấy theo Studium-Interessentest (HRK); ngành chưa có mã chờ chuyên gia gán. Ẩn chứ không xóa.')}
  <div class="row"><button class="btn dark" data-act="noop">+ Thêm ngành</button><button class="btn" data-act="noop">Nhập Excel</button><span class="chip">${D.majors.length} ngành</span><span class="chip warn">${D.majors.filter((m) => !m.codes.length).length} chưa có mã</span></div>
  <div class="tw" style="max-height:520px"><table><tr><th>Mã</th><th>Ngành</th><th>Cụm</th><th class="c">Mã Holland</th><th>Nguồn mã</th><th>Cặp</th><th>Hình thức</th><th class="c">Hiện</th></tr>
  ${D.majors.map((m) => `<tr><td class="mono">${m.id}</td><td><b>${esc(m.name_vi)}</b><br><span style="color:var(--fg-2);font-style:italic">${esc(m.name_de)}</span></td><td style="font-size:13px">${esc(m.group)}</td><td class="c mono">${m.codes.join(', ') || '<span class="chip warn">chưa có</span>'}</td><td style="font-size:12.5px;color:var(--fg-2)">${esc(m.code_source)}</td><td class="mono">${m.pairs.join(', ')}</td><td style="font-size:13px">${esc(m.routes)}</td><td class="c"><input type="checkbox" class="toggle" id="m-${m.id}" data-m="${m.id}" ${m.active ? 'checked' : ''} aria-label="Hiện ${esc(m.name_vi)}"></td></tr>`).join('')}</table></div>`;
}
function adminFields() {
  return `${what('Các ô học sinh điền. Bật "Bắt buộc", "Gửi CRM", "In báo cáo", "Hiện" cho từng ô; form ở bước 2 đổi ngay. Thử tắt "Bắt buộc" của Năm sinh rồi mở trang Học sinh.')}
  <div class="tw"><table><tr><th>Ô</th><th>Kiểu</th><th>Nhóm</th><th class="c">Bắt buộc</th><th class="c">Gửi CRM</th><th class="c">In báo cáo</th><th class="c">Hiện</th></tr>
  ${D.form_fields.map((f) => `<tr><td><b>${esc(f.label)}</b><br><span class="mono" style="color:var(--muted)">${f.key}</span></td><td>${esc(f.type)}</td><td>${esc(f.group)}</td>${['required', 'to_crm', 'on_report', 'visible'].map((k) => `<td class="c"><input type="checkbox" class="toggle" id="ff-${f.key}-${k}" data-ff="${f.key}" data-k="${k}" ${(k === 'visible' ? f.visible !== false : f[k]) ? 'checked' : ''} ${f.key === 'dong_y' ? 'disabled' : ''} aria-label="${k} ${esc(f.label)}"></td>`).join('')}</tr>`).join('')}</table></div>`;
}

/* ---------------- CẤU TRÚC HỆ THỐNG ---------------- */
function viewSystem() {
  const L = (t, boxes) => `<div class="layer"><h3>${t}</h3><div class="boxes">${boxes.map(([b, d, c]) => `<div class="box"><b>${b}</b>${d}${c ? `<br><small>${c}</small>` : ''}</div>`).join('')}</div></div>`;
  return `<section class="view">
  <div><div class="eyebrow">Laravel · holland.viger.edu.vn</div><h1>Cấu trúc hệ thống</h1><p class="lead" style="margin-top:8px">Bốn lớp, mỗi lớp chỉ nói chuyện với lớp kề nó. Phần tính toán tách khỏi giao diện nên đổi cách tính không phải sửa trang, và đổi trang không làm sai cách tính.</p></div>
  <div class="card arch">
    ${L('Giao diện', [['Học sinh', 'Chọn bài · Thông tin · Làm bài · Kết quả · Đặt lịch', 'resources/views/student'], ['Tư vấn viên', 'Thẻ khách (ở CRM, đọc qua API)', 'crm.viger.edu.vn'], ['Quản trị', 'Cài đặt · Câu hỏi · Cặp · 120 mã · Ngành · Trường thông tin', 'resources/views/admin'], ['API', 'questions · score · result · catalog', 'routes/api.php']])}
    ${L('Trình bày', [['ReportPresenter', 'Một kết quả, ba cách xem: khách, tư vấn viên, quản trị', 'app/Presenters'], ['FormSchema', 'Đọc cấu hình ô nhập, kiểm tra bắt buộc', 'app/Services/Customer'], ['HelpText', 'Chú thích "Trang này làm gì?"', 'help_texts']])}
    ${L('Tính toán', [['QuestionPicker', 'Rút đề: cố định / theo ý / ngẫu nhiên', 'app/Services/Assessment'], ['ScoringService', 'Trung bình 6 nhóm, bỏ câu "Không biết"', 'app/Services/Assessment'], ['ProfileAnalyzer', '2 chữ, điều kiện chữ 3, mã thay thế, quan hệ lục giác, cờ', 'app/Services/Holland'], ['CodeCatalog', 'Ghép 120 mã từ 27 dòng', 'app/Services/Holland'], ['MajorMatcher', 'Ngành nền của cặp, chỉ số C', 'app/Services/Catalog'], ['CrmSync', 'Gửi phiếu hồ sơ, gửi lại khi lỗi', 'app/Services/Integration']])}
    ${L('Dữ liệu', [['Câu hỏi & bài làm', 'questions · question_sets · attempts · answers', ''], ['Tham chiếu Holland', 'riasec_types · riasec_pairs · third_letters', ''], ['Ngành – nghề', 'majors · major_codes · occupations · major_occupation', ''], ['Khách', 'customers · form_fields · field_values · consents', ''], ['Vận hành', 'settings · versions · audit_logs · crm_outbox', '']])}
  </div>
  <div class="card" style="display:grid;gap:10px"><h3>Luồng một lượt làm bài</h3>
    <div class="flow"><span>Rút đề</span><i>→</i><span>Lưu câu trả lời + thời gian</span><i>→</i><span>Trung bình 6 nhóm</span><i>→</i><span>Xếp hạng</span><i>→</i><span>2 chữ (luôn có)</span><i>→</i><span>Chữ 3 &gt; ${fmt(D.settings.third_letter_threshold, 1)} và đủ ${D.settings.items_per_group} câu?</span><i>→</i><span>Ngành theo chỉ số C</span><i>→</i><span>Báo cáo theo người xem</span><i>→</i><span>Gửi CRM</span></div></div>
  <div class="grid2">
    <div class="card" style="display:grid;gap:8px"><h3>Cái gì sửa ở trang quản trị</h3><ul style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Ngưỡng, số câu, cách rút đề</li><li>Câu hỏi (nhập Excel), bật / tắt</li><li>15 cặp, chữ thứ ba, ngành, nghề, mã Holland</li><li>Ô thông tin khách: bắt buộc, gửi CRM</li><li>Chú thích trên mọi trang</li></ul></div>
    <div class="card" style="display:grid;gap:8px"><h3>Cái gì cố định trong mã nguồn</h3><ul style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Công thức trung bình cộng</li><li>Cách xếp hạng, khoảng cách lục giác</li><li>Chỉ số C, cách ghép 120 mã</li><li>Đã kiểm tra: bản PHP và bản JS trong trang này cho kết quả giống nhau trên 8 hồ sơ kiểm thử</li></ul></div>
  </div>
  <div class="card" style="display:grid;gap:8px"><h3>Dữ liệu đang chạy trong bản mẫu</h3><div class="row">
    <span class="chip">${D.riasec_types.length} nhóm</span><span class="chip">${D.riasec_pairs.length} cặp</span><span class="chip">${D.third_letters.length} chữ thứ ba</span><span class="chip">120 mã ghép tự động</span><span class="chip">${D.majors.length} ngành</span><span class="chip">${D.occupations.length} nghề</span><span class="chip">${D.major_occupation.length} liên kết</span><span class="chip">${D.form_fields.length} ô thông tin</span><span class="chip">${D.questions.length} câu (tạm)</span></div></div>
  </section>`;
}

/* ---------------- ĐIỀU HƯỚNG ---------------- */
const ROUTES = { 'hoc-sinh': viewStudent, 'tu-van': viewConsultant, 'quan-tri': viewAdmin, 'he-thong': viewSystem };
function route() { const h = location.hash.slice(1); return ROUTES[h] ? h : 'hoc-sinh'; }
function render() {
  const r = route();
  document.querySelectorAll('.nav a').forEach((a) => (a.getAttribute('href') === '#' + r ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  document.getElementById('app').innerHTML = ROUTES[r]();
  if (r === 'hoc-sinh' && ST.step === 2) ST.shownAt = performance.now();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-sample],[data-viewas],[data-tab]'); if (!t) return;
  if (t.dataset.sample) { fillSample(t.dataset.sample); return; }
  if (t.dataset.viewas) { ST.viewAs = t.dataset.viewas; render(); return; }
  if (t.dataset.tab) { ST.adminTab = t.dataset.tab; render(); return; }
  const a = t.dataset.act;
  if (a === 'go1') { ST.step = 1; render(); }
  if (a === 'back0') { ST.step = 0; render(); }
  if (a === 'prev') { ST.i = Math.max(0, ST.i - 1); render(); }
  if (a === 'next') { ST.i = Math.min(ST.i + 1, ST.qs.length - 1); render(); }
  if (a === 'finish') finish();
  if (a === 'restart') { ST.step = 0; ST.result = null; location.hash = '#hoc-sinh'; render(); }
  if (a === 'book') toast('Bản mẫu: trang đặt lịch sẽ mở ở đây');
  if (a === 'saveNote') toast('Đã lưu ghi nhận (bản mẫu)');
  if (a === 'noop') toast('Bản mẫu: chức năng này có trong web app thật');
  if (a === 'draw') { const qs = drawQuestions(); document.getElementById('draw').innerHTML = `<div class="sunk" style="font-size:13px"><b>Một đề rút thử (${qs.length} câu):</b> <span class="mono">${qs.map((q) => q.code).join(' ')}</span></div>`; }
  if (a === 'previewImpact') document.getElementById('impact').innerHTML = impactTable();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'ans') {
    const v = t.value === 'kb' ? null : +t.value; const ms = Math.round(performance.now() - ST.shownAt);
    const a = ST.answers[ST.i]; a.value = v; a.ms = (a.ms || 0) + ms;
    ST.fastRun = ms < 1000 ? ST.fastRun + 1 : 0;
    const at = ST.i; if (ST.i < ST.qs.length - 1) setTimeout(() => { if (ST.step === 2 && ST.i === at) { ST.i++; render(); } }, 180); else render();
    return;
  }
  if (t.dataset.f) { ST.info[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; return; }
  if (t.dataset.set) {
    const k = t.dataset.set; if (t.type === 'checkbox') D.settings[k] = t.checked; else if (k === 'draw_mode') D.settings[k] = t.value; else { const n = parseFloat(t.value.replace(',', '.')); if (!isNaN(n)) D.settings[k] = n; }
    E = makeEngine(D); if (ST.result && ST.answers.length) ST.result = E.score(ST.answers.map((a) => ({ ...a, value: a.value === undefined ? null : a.value }))); toast('Đã lưu cài đặt'); render(); return;
  }
  if (t.dataset.q) { D.questions.find((q) => q.code === t.dataset.q).active = t.checked; return; }
  if (t.dataset.m) { D.majors.find((m) => m.id === t.dataset.m).active = t.checked; E = makeEngine(D); if (ST.result) ST.result = E.score(ST.answers.map((a) => ({ ...a, value: a.value === undefined ? null : a.value }))); return; }
  if (t.dataset.ff) { const f = D.form_fields.find((x) => x.key === t.dataset.ff); f[t.dataset.k] = t.checked; toast('Đã cập nhật ô "' + f.label + '"'); return; }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.f && t.type !== 'checkbox') ST.info[t.dataset.f] = t.value;
  if (t.dataset.mon) { ST.info.diem_mon = ST.info.diem_mon || {}; ST.info.diem_mon[t.dataset.mon] = t.value; }
  if (t.dataset.codefilter !== undefined) { ST.codeFilter = t.value; const pos = t.selectionStart; render(); const el = document.getElementById('code-filter'); el.focus(); el.setSelectionRange(pos, pos); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'info') return; e.preventDefault(); ST.errors = {};
  for (const f of D.form_fields.filter((x) => x.required && x.visible !== false)) if (!ST.info[f.key]) ST.errors[f.key] = f.key === 'dong_y' ? 'Em cần đồng ý để tiếp tục.' : 'Ô này bắt buộc.';
  if (ST.info.so_dien_thoai && !/^0\d{9}$/.test(String(ST.info.so_dien_thoai).replace(/\s/g, ''))) ST.errors.so_dien_thoai = 'Số điện thoại cần 10 chữ số, bắt đầu bằng 0.';
  if (ST.info.dtb_hoc_ba) { const n = parseFloat(String(ST.info.dtb_hoc_ba).replace(',', '.')); if (isNaN(n) || n < 0 || n > 10) ST.errors.dtb_hoc_ba = 'Điểm từ 0 đến 10.'; }
  if (Object.keys(ST.errors).length) { render(); return; }
  startQuiz(); ST.step = 2; render(); window.scrollTo(0, 0);
});
render();
</script>
